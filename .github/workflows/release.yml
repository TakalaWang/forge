name: Release synchronized npm packages

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: npm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          lfs: true
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:verify
      - run: pnpm run library:build
      - run: pnpm run library:verify
      - name: Require synchronized code-package version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/release-library.mjs verify-code-version "${RELEASE_VERSION#v}"
      - name: Pack verified code packages
        run: node scripts/pack-library.mjs --group code --destination release-tarballs
      - name: Publish contracts
        run: npm publish release-tarballs/wasm-oj-contracts-${GITHUB_REF_NAME#v}.tgz --access public
      - name: Publish core
        run: npm publish release-tarballs/wasm-oj-core-${GITHUB_REF_NAME#v}.tgz --access public
      - name: Publish hosts and Organizer
        run: |
          npm publish release-tarballs/wasm-oj-browser-${GITHUB_REF_NAME#v}.tgz --access public
          npm publish release-tarballs/wasm-oj-server-${GITHUB_REF_NAME#v}.tgz --access public
          npm publish release-tarballs/wasm-oj-organizer-${GITHUB_REF_NAME#v}.tgz --access public
      - name: Publish umbrella SDK
        run: npm publish release-tarballs/wasm-oj-sdk-${GITHUB_REF_NAME#v}.tgz --access public
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --latest
