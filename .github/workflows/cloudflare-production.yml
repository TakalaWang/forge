name: Deploy Cloudflare production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          lfs: true
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the release Container tag against immutable OCI bytes
        env:
          RELEASE_REQUEST_BASE64: ${{ secrets.WASM_OJ_PRODUCTION_RELEASE_REQUEST_BASE64 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node scripts/verify-oci-release-image.mjs
          --activation-request-base64-env RELEASE_REQUEST_BASE64
          --config wrangler.quick-production.jsonc
          --expected-git-commit "$GITHUB_SHA"
          --output-dir release-evidence/oci
      - name: Bind the exact active release to the production deployment
        env:
          RELEASE_REQUEST_BASE64: ${{ secrets.WASM_OJ_PRODUCTION_RELEASE_REQUEST_BASE64 }}
        run: >-
          node scripts/configure-production-release.mjs
          --activation-request-base64-env RELEASE_REQUEST_BASE64
          --config wrangler.quick-production.jsonc
          --expected-git-commit "$GITHUB_SHA"
          --oci-evidence release-evidence/oci/evidence.json
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Apply non-reset database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/production-migrations.mjs normal --database DB --config wrangler.quick-production.jsonc
      - name: Deploy application, Workflows, and Containers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.quick-production.jsonc
      - name: Wait for the exact Submission Container rollout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node scripts/wait-container-rollout.mjs
          --config wrangler.quick-production.jsonc
          --output release-evidence/container-rollout.json
      - name: Smoke test
        run: |
          curl --fail --retry 6 --retry-all-errors --retry-delay 5 \
            https://wasm-oj-forge-production.jacob.workers.dev/api/health/live
          curl --fail --retry 6 --retry-all-errors --retry-delay 5 \
            https://wasm-oj-forge-production.jacob.workers.dev/api/health/ready
      - name: Preserve exact OCI verification bytes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-release-oci-${{ github.run_id }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
