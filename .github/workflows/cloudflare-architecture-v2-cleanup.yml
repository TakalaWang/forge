name: Cloudflare architecture v2 post-fence cleanup

on:
  workflow_dispatch:
    inputs:
      cutover_run_id:
        description: Successful architecture v2 cutover workflow run ID
        required: true
        type: string
      confirmation:
        description: Type DELETE-EXACT-LEGACY-R2-KEYS
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Require exact-key cleanup acknowledgement
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: >-
          node -e "if(process.env.CONFIRMATION!=='DELETE-EXACT-LEGACY-R2-KEYS')
          throw new Error('Exact-key R2 cleanup acknowledgement is missing')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the immutable cutover inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: architecture-v2-cutover-${{ inputs.cutover_run_id }}
          path: cutover-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.cutover_run_id }}
      - name: Delete only inventoried legacy objects after the 24-hour fence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WASM_OJ_ARCHITECTURE_RESET_TOKEN: ${{ secrets.WASM_OJ_ARCHITECTURE_RESET_TOKEN }}
          WASM_OJ_ARCHITECTURE_RESET_TOKEN_PROVIDED: ${{ secrets.WASM_OJ_ARCHITECTURE_RESET_TOKEN }}
        run: >-
          node scripts/architecture-reset-r2.mjs cleanup
          --database DB
          --bucket wasm-oj-judge-production
          --config wrangler.quick-production.jsonc
          --manifest cutover-evidence/r2-cleanup-manifest.json
          --receipt cutover-evidence/source-tombstone-receipt.json
