name: Verify WASM-OJ problem collection
description: Verify repository manifests, public projections, digests, and deployable judge packages.
inputs:
  version:
    description: Exact @wasm-oj/cli release containing the collection contract.
    required: false
    default: 0.2.4
  root:
    description: Repository root containing wasm-oj.json.
    required: false
    default: .
  source:
    description: Optional repository authoring input path.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Verify WASM-OJ collection
      shell: bash
      env:
        WASM_OJ_ACTION_PACKAGE: "@wasm-oj/cli@${{ inputs.version }}"
        WASM_OJ_ACTION_ROOT: "${{ inputs.root }}"
        WASM_OJ_ACTION_SOURCE: "${{ inputs.source }}"
      run: |
        arguments=(organizer collection verify "$WASM_OJ_ACTION_ROOT")
        if [[ -n "$WASM_OJ_ACTION_SOURCE" ]]; then
          arguments+=(--source "$WASM_OJ_ACTION_SOURCE")
        fi
        npx --yes --package "$WASM_OJ_ACTION_PACKAGE" -- woj "${arguments[@]}"
